[project]
name = "mcp-agents"
version = "0.1.0"
description = "Système multi-agents IA (Product Owner, QA, Dev Full Stack, UX, Architecte UI, Veille réseaux) basé sur MCP et Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-agents = "mcp_agents.cli:main"
mcp-agents-telegram = "mcp_agents.telegram_bot:main"
social-research-server = "mcp_agents.servers.social_research_server:run"
github-server = "mcp_agents.servers.github_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agents"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_agents"]

# --- Mypy (type checking) ---
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp_agents.telegram_bot"
# python-telegram-bot expose beaucoup de types Optional/Any — on assouplit ici.
disable_error_code = ["union-attr", "index", "arg-type", "no-any-return"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
